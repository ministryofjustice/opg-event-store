name: Test configuration

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test
        run: docker compose up test

      - name: Check build possible
        run: docker compose run -e BASE_PATH=/opg-event-store builder
