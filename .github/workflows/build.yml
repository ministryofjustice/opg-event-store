name: Test configuration

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Test
        run: docker compose up test

      - name: Check build possible
        run: docker compose run -e BASE_PATH=/opg-event-store builder
